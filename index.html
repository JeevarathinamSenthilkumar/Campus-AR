<!DOCTYPE html>
<html>
  <head>
    <title>Web AR Navigation</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-ar.js@1.8.2/aframe-ar.js"></script>
  </head>
  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: true;">
      
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- Example: Arrow at Engineering Building -->
      <a-entity gps-entity-place="latitude:31.7714; longitude:-106.5059"
                gltf-model="url(assets/arrow.usdz)"
                scale="2 2 2"></a-entity>
    </a-scene>
  </body>
</html>
